<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Table</title>
  
  <link rel="stylesheet" href="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
   1<link rel="stylesheet" href="index2.css">



</head>
<body>

<div class="container my-5">
  <div class="table-responsive">
    <table class="table table-bordered align-middle text-center">
      <thead>
        <tr>
          <th scope="col">IMAGE</th>
          <th scope="col">PRODUCT</th>
          <th scope="col">PRICE</th>
          <th scope="col">PURCHASE</th>
          <th scope="col">REMOVE</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><img src="img.html/imge.webp" alt="Mandrain Orange" class="product-img"></td>
          <td><strong>Mandrain Orange</strong></td>
          <td>$4.39</td>
          <td><button class="btn btn-select">Select Options</button></td>
          <td><span class="delete-icon">&#128465;</span></td>
        </tr>
        <tr>
          <td><img src="img.html/Watermelon3.webp" alt="" class="product-img"></td>
          <td><strong>Watermelon</strong></td>
          <td>$8.47</td>
          <td><button class="btn btn-select">Select Options</button></td>
          <td><span class="">&#128465;</span></td>
        </tr>
        <tr>
          <td><img src="img.html/ChickenBoneless3.webp" alt="Puffs" class="product-img"></td>
          <td><strong>Puffs</strong></td>
          <td>$2.54</td>
          <td><button class="btn btn-select">Select Options</button></td>
          <td><span class="delete-icon">&#128465;</span></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
