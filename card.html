<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"> 
  <title>Your Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="card.css">
</head>
<body>

  <div class="cart-title">Your cart</div>

  <div class="cart-item d-flex align-items-start">
    <img src="img.html/ChickenBoneless3.webp" class="item-image me-3" alt="Puffs">
    <div>
      <div class="item-title">Puffs</div>
      <div>Container Type: Pouch,<br>Flavour: Vegtable,<br>Rich In: Vitamin B12</div>
      <div class="item-price mt-1">$2.54</div>
      <div class="quantity-control mt-2">
        <button class="btn btn-outline-secondary btn-sm"><i class="fas fa-minus"></i></button>
        <span>1</span>
        <button class="btn btn-outline-secondary btn-sm"><i class="fas fa-plus"></i></button>
        <button class="circle-btn ms-3"><i class="fas fa-trash"></i></button>
      </div>
    </div>
  </div>

  <div class="cart-item d-flex align-items-start">
    <img src="img.html/Watermelon3.webp" class="item-image me-3" alt="Watermelon">
    <div>
      <div class="item-title">Watermelon</div>
      <div>Quantity: 16 oz,<br>Container Type: Tray,<br>Rich In: Vitamin C</div>
      <div class="item-price mt-1">$8.47</div>
      <div class="quantity-control mt-2">
        <button class="btn btn-outline-secondary btn-sm"><i class="fas fa-minus"></i></button>
        <span>1</span>
        <button class="btn btn-outline-secondary btn-sm"><i class="fas fa-plus"></i></button>
        <button class="circle-btn ms-3"><i class="fas fa-trash"></i></button>
      </div>
    </div>
  </div>

  <div class="cart-item d-flex align-items-start">
    <img src="img.html/imge.webp" class="item-image me-3" alt="Mandrain Orange">
    <div>
      <div class="item-title">Mandrain Orange</div>
      <div>Quantity: 5 kg</div>
    </div>
  </div>

  <div class="subtotal-section mt-3">
    <strong>Subtotal:</strong> $15.40 USD<br>
    <small>Taxes and shipping calculated at checkout</small>
  </div>

  <div class="btn-group d-flex gap-2">
    <button class="btn btn-success flex-fill">View Cart</button>
    <button class="btn btn-success flex-fill">Check Out</button>
  </div>

</body>
</html>
